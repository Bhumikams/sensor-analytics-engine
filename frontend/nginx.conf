server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The built JS calls "/api/..." (see Dockerfile's VITE_API_URL build
    # arg) — same origin as this page, so the browser never has to deal
    # with CORS. nginx forwards those requests to the api container over
    # the compose-internal network, which is the only thing that can
    # reach "api" or "mongo" at all in production (see docker-compose.yml).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router uses client-side routing (/sensors/temp-1 is not a real
    # file) — fall back to index.html for anything nginx can't find on
    # disk, and let React Router decide what to render.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
